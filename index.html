<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<title>自宅deトリイク｜準備中｜トリイク</title>
<meta name="description" content="自宅deトリイクは近日公開予定です。">
<link rel="canonical" href="https://toriiku-jp.com/home/">

<style>
  :root{
    --accent:#FF6B35;
    --ink:#1A1A1A;
    --ink-sub:#6B6B6B;
    --bg-soft:#FAF8F5;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    color:var(--ink);
    background:var(--bg-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .card{
    max-width:480px;
  }
  .badge{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    color:#fff;
    background:var(--accent);
    padding:6px 16px;
    border-radius:999px;
    margin-bottom:20px;
  }
  h1{
    font-size:26px;
    font-weight:800;
    line-height:1.5;
    margin:0 0 16px;
  }
  p{
    font-size:14px;
    color:var(--ink-sub);
    line-height:1.8;
    margin:0 0 28px;
  }
  a.btn{
    display:inline-block;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    border:1px solid #DDD8D0;
    border-radius:999px;
    padding:10px 22px;
    background:#fff;
  }
  a.btn:hover{border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>

  <div class="card">
    <span class="badge">COMING SOON</span>
    <h1>自宅deトリイク<br>近日公開予定です。</h1>
    <p>
      受け取るたび、ちょっと得する。<br>
      新しいサービスの準備を進めています。<br>
      公開まで、今しばらくお待ちください。
    </p>
    <a class="btn" href="https://toriiku-jp.com/">トリイクスポットの利用はこちら →</a>
  </div>

</body>
</html>
